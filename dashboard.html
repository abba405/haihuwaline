<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HaihuwaLine — Dashboard</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 28px 0; }
  .stat-card {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); padding: 16px 18px;
  }
  .stat-card .num { font-family: var(--font-display); font-size: var(--text-display); color: var(--color-primary-dark); }
  .stat-card .label { font-size: var(--text-xs); color: var(--color-text-muted); }

  .report-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-left: 4px solid var(--color-border);
    border-radius: var(--radius); padding: 12px 18px; margin-bottom: 8px;
  }
  .report-row.new { border-left-color: var(--color-accent); }
  .report-row.acknowledged { border-left-color: var(--color-amber); }
  .report-row.resolved { border-left-color: var(--color-sage); opacity: 0.75; }

  .report-meta { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 3px; }

  .ack-btn, .resolve-btn {
    border: none; border-radius: 6px; padding: 8px 14px; font-size: var(--text-xs); font-weight: 500;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .ack-btn { background: var(--color-primary); color: #fff; }
  .ack-btn:hover { background: var(--color-primary-dark); }
  .resolve-btn { background: var(--color-surface); color: var(--color-sage); border: 1px solid var(--color-sage); }
  .resolve-btn:hover { background: #EEF4EA; }
  .ack-btn:active, .resolve-btn:active { transform: scale(0.96); }

  #empty { color: var(--color-text-muted); padding: 48px 0; text-align: center; }

  /* Stat numbers pulse briefly when their value actually changes */
  @keyframes stat-pulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.18); color: var(--color-accent); }
    100% { transform: scale(1); }
  }
  .stat-pulse { animation: stat-pulse 0.5s ease-out; }

  /* Modal for entering a phone number, replacing the native browser prompt */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(33, 32, 28, 0.45);
    display: flex; align-items: center; justify-content: center; z-index: 50;
    animation: fade-in 0.15s ease-out;
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .modal-box {
    background: var(--color-surface); border-radius: 14px; padding: 28px;
    width: min(360px, 90vw); animation: modal-in 0.2s ease-out;
  }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(10px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-box input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--color-border);
    border-radius: 8px; font-family: var(--font-body); font-size: var(--text-base);
    margin: 14px 0 18px;
  }
  .modal-box input:focus { outline: 2px solid var(--color-primary); outline-offset: 1px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-cancel {
    background: none; border: none; color: var(--color-text-muted); padding: 8px 14px; font-size: var(--text-sm);
  }

  /* Toast — signals a new report arriving, the moment that matters most for this product */
  #toast-stack {
    position: fixed; top: 20px; right: 20px; z-index: 60;
    display: flex; flex-direction: column; gap: 10px;
  }
  .toast {
    background: var(--color-primary-dark); color: #fff; padding: 14px 18px;
    border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    max-width: 320px; animation: toast-in 0.35s cubic-bezier(0.2, 0.8, 0.3, 1), toast-out 0.3s ease-in 4.7s forwards;
  }
  @keyframes toast-in { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes toast-out { to { opacity: 0; transform: translateX(30px); } }
  .toast strong { display: block; font-size: var(--text-sm); margin-bottom: 2px; }
  .toast span { font-size: var(--text-xs); color: #D9E8E4; }

  @media (prefers-reduced-motion: reduce) {
    .modal-overlay, .modal-box, .toast, .stat-pulse { animation: none; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="/">HaihuwaLine</a>
    <nav><a href="/">Home</a></nav>
  </div>
</header>

<main class="wrap" style="padding-top: 40px; padding-bottom: 64px;">
  <h1 style="font-size: var(--text-lg);">Facility dashboard</h1>
  <p style="color: var(--color-text-muted);"><span class="pulse-dot"></span>Live — refreshing every 10 seconds</p>

  <div class="stats">
    <div class="stat-card"><div class="num" id="stat-new">–</div><div class="label">New</div></div>
    <div class="stat-card"><div class="num" id="stat-ack">–</div><div class="label">Acknowledged</div></div>
    <div class="stat-card"><div class="num" id="stat-resolved">–</div><div class="label">Resolved</div></div>
  </div>

  <div id="feed"></div>
  <div id="empty" style="display:none;">No reports yet — they'll appear here the moment someone dials in.</div>
</main>

<div id="toast-stack"></div>

<script>
let knownIds = new Set();
let statValues = { new: null, ack: null, resolved: null };
let pendingAcknowledgeId = null;

function pulseStatIfChanged(elId, key, value) {
  const el = document.getElementById(elId);
  if (statValues[key] !== null && statValues[key] !== value) {
    el.classList.remove('stat-pulse');
    void el.offsetWidth; // restart animation
    el.classList.add('stat-pulse');
  }
  el.textContent = value;
  statValues[key] = value;
}

function showToast(report) {
  const stack = document.getElementById('toast-stack');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<strong>New report — ${report.emergency_type.replace('_', ' ')}</strong><span>${report.location_ward} · via ${report.source_channel}</span>`;
  stack.appendChild(toast);
  setTimeout(() => toast.remove(), 5000);
}

async function loadReports() {
  const res = await fetch('/reports');
  const reports = await res.json();

  pulseStatIfChanged('stat-new', 'new', reports.filter(r => r.status === 'new').length);
  pulseStatIfChanged('stat-ack', 'ack', reports.filter(r => r.status === 'acknowledged').length);
  pulseStatIfChanged('stat-resolved', 'resolved', reports.filter(r => r.status === 'resolved').length);

  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty');

  if (reports.length === 0) {
    feed.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const isFirstLoad = knownIds.size === 0;

  feed.innerHTML = reports.map(r => {
    const isNewlySeen = !isFirstLoad && !knownIds.has(r.id);
    if (isNewlySeen) showToast(r);

    let action = `<span class="status-badge status-${r.status}">${r.status}</span>`;
    if (r.status === 'new') {
      action = `<button class="ack-btn" onclick="openAcknowledgeModal(${r.id})">Acknowledge</button>`;
    } else if (r.status === 'acknowledged') {
      action = `<button class="resolve-btn" onclick="resolveReport(${r.id})">Mark resolved</button>`;
    }

    return `
    <div class="report-row ${r.status} ${isNewlySeen ? 'just-arrived' : ''}">
      <div>
        <strong>${r.emergency_type.replace('_', ' ')}</strong> — ${r.location_ward}${r.landmark ? ` (${r.landmark})` : ''}
        <div class="report-meta">Via ${r.source_channel} · ${r.reporter_phone} · ${r.created_at}</div>
      </div>
      <div>${action}</div>
    </div>
  `;
  }).join('');

  knownIds = new Set(reports.map(r => r.id));
}

function openAcknowledgeModal(id) {
  pendingAcknowledgeId = id;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'ack-modal';
  overlay.innerHTML = `
    <div class="modal-box">
      <h3 style="font-size: var(--text-base); margin-bottom: 4px;">Acknowledge report</h3>
      <p class="text-sm" style="color: var(--color-text-muted); margin: 0;">
        Enter your phone number for the response record. Fast responses (within 10 minutes) earn an airtime reward.
      </p>
      <input type="tel" id="ack-phone-input" placeholder="+234...">
      <div class="modal-actions">
        <button class="modal-cancel" onclick="closeAcknowledgeModal()">Cancel</button>
        <button class="ack-btn" onclick="submitAcknowledge()">Confirm</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('ack-phone-input').focus();
}

function closeAcknowledgeModal() {
  const overlay = document.getElementById('ack-modal');
  if (overlay) overlay.remove();
  pendingAcknowledgeId = null;
}

async function submitAcknowledge() {
  const phone = document.getElementById('ack-phone-input').value.trim();
  if (!phone) return;
  const id = pendingAcknowledgeId;
  closeAcknowledgeModal();

  const res = await fetch(`/reports/${id}/acknowledge`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ acknowledgedBy: phone }),
  });
  const data = await res.json();

  if (data.rewarded) {
    showToast({ emergency_type: 'reward sent 🎉', location_ward: `Acknowledged in ${data.minutesElapsed} min`, source_channel: 'airtime' });
  }
  loadReports();
}

async function resolveReport(id) {
  await fetch(`/reports/${id}/resolve`, { method: 'POST' });
  loadReports();
}

loadReports();
setInterval(loadReports, 10000); // refresh every 10s so the feed feels live
</script>

</body>
</html>
